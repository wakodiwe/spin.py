[build-system]
requires = ["uv_build>=0.5.0,<1.0.0"]
build-backend = "uv_build"

[project]
name = "wako-spin"
version = "0.1.0"
description = "Dependency-free loading spinner for Python 3"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.7"
authors = [{name = "Wako Diwe"}]
keywords = ["spinner", "loading", "tty", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]

[tool.uv.build-backend]
module-name = "spin"
module-root = "src"

